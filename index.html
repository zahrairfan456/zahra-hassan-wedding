<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Zahra & Hassan | Wedding Invitation</title>

    <link rel="stylesheet" href="style.css">

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
</head>

<body>

    <!-- COVER -->
    <section class="hero">

        <div class="flower flower-left">❀</div>
        <div class="flower flower-right">❀</div>

        <p class="small-title">TOGETHER WITH THEIR FAMILIES</p>

        <h1>Zahra <span>&</span> Hassan</h1>

        <p class="invite-text">
            Joyfully invite you to celebrate<br>
            their wedding
        </p>

        <div class="divider">❦</div>

        <p class="date">20 • 12 • 2026</p>

        <button onclick="showMessage()">
            Open Invitation
        </button>

    </section>


    <!-- WEDDING DETAILS -->
    <section class="details">

        <p class="small-title">THE CELEBRATION</p>

        <h2>Our Special Day</h2>

        <div class="detail-card">

            <div class="detail">
                <span class="icon">♡</span>
                <h3>Wedding Date</h3>
                <p>Sunday, December 20, 2026</p>
            </div>

            <div class="detail">
                <span class="icon">✦</span>
                <h3>Venue</h3>
                <p>Islamabad, Pakistan</p>
            </div>

            <div class="detail">
                <span class="icon">❀</span>
                <h3>Time</h3>
                <p>7:00 PM</p>
            </div>

        </div>

        <button class="rsvp" onclick="showRSVP()">
            RSVP
        </button>

    </section>


    <!-- FOOTER -->
    <footer>
        <p>With love, Zahra & Hassan</p>
        <span>♡</span>
    </footer>


    <script src="script.js"></script>

</body>
</html>
